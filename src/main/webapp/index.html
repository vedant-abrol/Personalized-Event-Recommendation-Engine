<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Discover personalized event recommendations near you">
  <title>Event Recommender</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="static/styles/main.css">
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <div class="header-content">
        <div class="logo">
          <div class="logo-icon">
            <i class="fa fa-calendar-check-o"></i>
          </div>
          <div class="logo-text">
            <h1 class="title">EventFinder</h1>
            <p class="subtitle">Discover amazing events near you</p>
          </div>
        </div>
        <button id="dark-mode-toggle" class="dark-mode-toggle" aria-label="Toggle dark mode">
          <i class="fa fa-moon-o"></i>
        </button>
      </div>
      <nav class="nav">
        <button id="nearby-btn" class="nav-btn active">
          <i class="fa fa-map-marker"></i>
          <span>Nearby</span>
        </button>
        <button id="fav-btn" class="nav-btn">
          <i class="fa fa-heart"></i>
          <span>Favorites</span>
        </button>
        <button id="recommend-btn" class="nav-btn">
          <i class="fa fa-star"></i>
          <span>For You</span>
        </button>
      </nav>
      <div class="filter-bar">
        <div class="filter-group">
          <label for="category-filter" class="filter-label">
            <i class="fa fa-filter"></i>
            <span>Category</span>
          </label>
          <select id="category-filter" class="category-select">
            <option value="All">All Categories</option>
            <option value="Music">Music</option>
            <option value="Sports">Sports</option>
            <option value="Arts & Theatre">Arts & Theatre</option>
            <option value="Film">Film</option>
            <option value="Comedy">Comedy</option>
            <option value="Family">Family</option>
          </select>
        </div>
      </div>
    </div>
  </header>

  <main>
    <section class="content container">
      <div id="status-banner" class="status-banner" hidden></div>
      <ul id="item-list" class="item-list">
        <!-- Items will be dynamically loaded here -->
      </ul>
    </section>
  </main>

  <footer>
    <div class="container footer-content">
      <p class="muted"><i class="fa fa-ticket"></i> Powered by TicketMaster API</p>
    </div>
  </footer>

  <script src="static/scripts/main.js"></script>
</body>
</html>
